name: pkgenerus_app
description: "Klien mobile PKGenerus (Flutter) — backend tetap Laravel (API v1 + Sanctum)."
publish_to: 'none'
version: 1.5.2+19

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # Bawaan SDK Flutter (bukan paket pihak ketiga): dibutuhkan agar
  # showDatePicker/widget Material berbahasa Indonesia saat locale 'id'.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_riverpod: 3.0.0
  go_router: ^18.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^7.3.1
  mobile_scanner: ^7.4.0
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  flutter_local_notifications: 19.4.2
  webview_flutter: ^4.14.1
  quran_api: ^0.1.1
  qcf_quran: ^0.0.5
  pdfrx: ^2.6.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/branding/pkg-logo-trimmed.png
    - assets/quran/uthmani.json
