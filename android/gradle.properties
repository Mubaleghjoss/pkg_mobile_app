# Local JDK overrides belong in the user's global ~/.gradle/gradle.properties,
# not in this repository.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Incremental Kotlin compilation dimatikan: di Windows (drive E:, indexer/AV aktif)
# cache .tab kerap terkunci -> "Could not close incremental caches".
# Beberapa plugin MLKit lama masih menetapkan Java 11 sementara Kotlin 17.
# Validasi mismatch diturunkan menjadi warning; app dan plugin TFLite utama tetap target 17.
kotlin.jvm.target.validation.mode=warning
kotlin.incremental=false
org.gradle.parallel=false
org.gradle.caching=false
