# JDK yang dipakai modul android. Tanpa baris ini, Android Studio/IntelliJ
# melaporkan "No JDK specified for module 'pkgenerus_app_android'" karena IDE
# tidak mewarisi JAVA_HOME dari shell (env.sh hanya berlaku di terminal).
org.gradle.java.home=E:/hermes/tools/jdk17
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Incremental Kotlin compilation dimatikan: di Windows (drive E:, indexer/AV aktif)
# cache .tab kerap terkunci -> "Could not close incremental caches".
kotlin.incremental=false
org.gradle.parallel=false
org.gradle.caching=false
