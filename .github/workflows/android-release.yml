name: Android release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Upload the verified APK to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_ID: id.pkgenerus.pkgenerus_app
  API_BASE: https://pkgenerus.my.id

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.metadata.outputs.apk_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets and create temporary signing files
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/pkgenerus-release.jks"
          printf 'KEYSTORE_PATH=%s\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"
          for name in ANDROID_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::A required Android signing secret is missing."
              exit 1
            fi
          done
          umask 077
          KEYSTORE_BASE64_PATH="$RUNNER_TEMP/pkgenerus-release.jks.b64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' > "$KEYSTORE_BASE64_PATH"
          [[ -s "$KEYSTORE_BASE64_PATH" ]] || { echo '::error::Signing keystore Base64 payload is empty.'; exit 1; }
          if ! base64 --decode "$KEYSTORE_BASE64_PATH" > "$KEYSTORE_PATH"; then
            echo '::error::Signing keystore secret is not valid Base64.'
            exit 1
          fi
          rm -f "$KEYSTORE_BASE64_PATH"
          [[ -s "$KEYSTORE_PATH" ]] || { echo '::error::Decoded keystore is empty.'; exit 1; }
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" \
            >/dev/null 2>&1; then
            echo '::error::Decoded keystore or store password is invalid.'
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Key alias is invalid or missing from the decoded keystore.'
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PATH" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]] || {
            echo '::error::pubspec version must use versionName+versionCode format.'; exit 1;
          }
          version_name="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          if (( version_code <= 15 )); then
            echo "::error::versionCode must be greater than the currently released code 15 (found ${version_code})."
            exit 1
          fi
          apk_name="pkgenerus-${version_name}-${version_code}.apk"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=pkgenerus-android-${version_name}-${version_code}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release --dart-define=PKG_API_BASE=https://pkgenerus.my.id

      - name: Verify and name APK
        shell: bash
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          set -euo pipefail
          source_apk=build/app/outputs/flutter-apk/app-release.apk
          [[ -s "$source_apk" ]] || { echo '::error::Release APK was not produced.'; exit 1; }
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$build_tools/apksigner" && -x "$build_tools/aapt" ]] || {
            echo '::error::Android APK verification tools were not found.'; exit 1;
          }
          "$build_tools/apksigner" verify --verbose --print-certs "$source_apk"
          badging="$("$build_tools/aapt" dump badging "$source_apk")"
          grep -Fq "package: name='${PACKAGE_ID}'" <<< "$badging" || {
            echo '::error::APK applicationId does not match the expected package.'; exit 1;
          }
          mkdir -p dist
          cp "$source_apk" "dist/$APK_NAME"
          unzip -tqq "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties "$KEYSTORE_PATH" "$RUNNER_TEMP/pkgenerus-release.jks.b64"

  deploy_production:
    name: Deploy production APK
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Validate deployment secrets and prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PKGENERUS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PKGENERUS_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.PKGENERUS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS_B64: ${{ secrets.PKGENERUS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.PKGENERUS_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS_B64 DEPLOY_PORT; do
            [[ -n "${!name}" ]] || { echo '::error::A required production deployment secret is missing.'; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo '::error::Deployment port must be numeric.'; exit 1; }
          [[ "$DEPLOY_USER" != root ]] || { echo '::error::Production deployment must not use root.'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s' "$DEPLOY_KNOWN_HOSTS_B64" | base64 --decode > "$RUNNER_TEMP/ssh/known_hosts"
          [[ -s "$RUNNER_TEMP/ssh/known_hosts" ]] || { echo '::error::Decoded known_hosts is empty.'; exit 1; }
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" >/dev/null

      - name: Upload, verify, and atomically publish APK
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PKGENERUS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PKGENERUS_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PKGENERUS_DEPLOY_PORT }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          apk="dist/$APK_NAME"
          checksum="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"
          remote_dir='/var/www/pkgenerus.my.id/shared/storage/app/private/app-releases'
          remote_tmp=".${APK_NAME}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          ssh_opts=(-i "$RUNNER_TEMP/ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          scp_opts=(-i "$RUNNER_TEMP/ssh/deploy_key" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          cleanup_remote_tmp() {
            printf '%s\n' 'rm -f -- "$1/$2"' | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" sh -s -- "$remote_dir" "$remote_tmp" || true
          }
          trap cleanup_remote_tmp EXIT
          scp "${scp_opts[@]}" -- "$apk" "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/$remote_tmp"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" sh -s -- "$remote_dir" "$remote_tmp" "$APK_NAME" "$size" "$checksum" <<'REMOTE'
          set -eu
          dir=$1 tmp=$2 final=$3 expected_size=$4 expected_hash=$5
          tmp_path="$dir/$tmp"; final_path="$dir/$final"
          test -f "$tmp_path"
          actual_size=$(wc -c < "$tmp_path" | tr -d ' ')
          test "$actual_size" = "$expected_size"
          actual_hash=$(sha256sum "$tmp_path" | awk '{print $1}')
          test "$actual_hash" = "$expected_hash"
          unzip -tqq "$tmp_path"
          if test -f "$final_path"; then
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp -p -- "$final_path" "$final_path.backup-$stamp"
          fi
          mv -f -- "$tmp_path" "$final_path"
          REMOTE
          trap - EXIT

      - name: Remove temporary SSH files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ssh"
